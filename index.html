.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px} select,input{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;min-width:150px}
.flash{min-height:310px;display:grid;place-items:center;text-align:center;cursor:pointer;border-radius:20px;background:linear-gradient(145deg,#fff,#f8f5ff);border:1px solid var(--line);padding:28px;user-select:none}
.flash .word{font-size:clamp(30px,7vw,58px);font-weight:750;line-height:1.12} .flash .hint{color:var(--muted);margin-top:18px} .flash.revealed{background:linear-gradient(145deg,#f1fff9,#f7f5ff)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px} .good{background:#e7f8f1;color:#08754c} .bad{background:#fff0f0;color:#b72d2d}

</style></head>
<body><div class="app"><header><div><h1>English Cards</h1><div class="sub">Карточки, пары и ввод слов из твоего файла</div></div><div class="stats" id="stats"></div></header>
<div class="tabs"><button data-tab="flash" class="active">Карточки</button><button data-tab="match">Соединить пары</button><button data-tab="type">Вписать слово</button><button data-tab="list">Все слова</button></div>
<section class="panel">

<div id="typeView" class="hidden"><div class="type-card"><div class="small" id="typeLabel"></div><div class="prompt" id="typePrompt"></div><div class="type-row"><input id="typeInput" autocomplete="off" placeholder="Введи ответ"><button class="primary" id="check">Проверить</button></div><div class="feedback" id="feedback"></div><button id="typeNext">Следующее слово</button></div></div>
<div id="listView" class="hidden"><input id="search" placeholder="Поиск слова или перевода" style="width:100%;margin-bottom:14px"><div class="list" id="wordList"></div></div>
</section><footer>Прогресс хранится только в этом браузере.</footer></div>
